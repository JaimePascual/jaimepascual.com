<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaime Pascual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4;
    --ink: #1c1b1a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141311; --ink: #f3efe8; }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
  }

  main {
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;      /* centrado vertical */
    justify-content: center;  /* centrado horizontal */
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }

  h1 {
    margin: 0;
    text-align: center;
    white-space: nowrap;
    font-family: "Cinzel", Georgia, "Times New Roman", serif;
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.1;
    color: var(--ink);
    font-size: 8vw; /* respaldo; el script lo ajusta al ancho exacto */
  }

  h1 span { display: inline-block; white-space: nowrap; }

  /* Móvil: una palabra debajo de la otra */
  @media (max-width: 700px) {
    h1 { font-size: 12vw; }
    h1 span { display: block; width: max-content; margin: 0 auto; }
  }

  /* Pie de página: centrado, abajo del todo */
  footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    text-align: center;
    padding: 0 4vw;
  }

  footer a,
  footer a:visited,
  footer a:hover,
  footer a:active {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.15rem, 1rem + 0.6vw, 1.5rem);
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 0.2em;
    text-decoration-thickness: 1px;
  }
</style>
</head>
<body>
  <main>
    <h1 id="nombre"><span>Jaime</span> <span>Pascual</span></h1>
    <footer><a href="mailto:jpasx@hotmail.com">Escríbeme</a></footer>
  </main>

  <script>
    // Ajusta el tamaño de letra al ancho de pantalla midiendo el texto ya dibujado.
    (function () {
      var ANCHO_MOVIL = 0.80;       // 80 % del ancho en móvil
      var ANCHO_ESCRITORIO = 0.90;  // 90 % del ancho en pantallas grandes

      var h1 = document.getElementById('nombre');
      var spans = h1.querySelectorAll('span');

      function anchoTexto() {
        var a = spans[0].getBoundingClientRect();
        var b = spans[1].getBoundingClientRect();
        if (getComputedStyle(spans[0]).display === 'block') {
          return Math.max(a.width, b.width);   // móvil: la línea más ancha
        }
        return b.right - a.left;               // escritorio: toda la línea
      }

      function fit() {
        var movil = getComputedStyle(spans[0]).display === 'block';
        var objetivo = document.documentElement.clientWidth * (movil ? ANCHO_MOVIL : ANCHO_ESCRITORIO);
        var size = 100;
        for (var i = 0; i < 4; i++) {
          h1.style.fontSize = size + 'px';
          var w = anchoTexto();
          if (!w) return;
          var nuevo = size * objetivo / w;
          var parar = Math.abs(nuevo - size) < 0.5;
          size = nuevo;
          if (parar) break;
        }
        h1.style.fontSize = size + 'px';
      }

      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      window.addEventListener('load', fit);
      document.addEventListener('DOMContentLoaded', fit);
      if (document.fonts) {
        // Volver a medir cuando Cinzel esté realmente cargada
        document.fonts.load('500 100px Cinzel').then(fit, fit);
        document.fonts.addEventListener('loadingdone', fit);
        if (document.fonts.ready) document.fonts.ready.then(fit);
      }
      setTimeout(fit, 400);
      setTimeout(fit, 1500);
      fit();
    })();
  </script>
</body>
</html>
