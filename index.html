<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaime Pascual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4;
    --ink: #1c1b1a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141311; --ink: #f3efe8; }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
  }

  main {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;      /* centrado vertical */
    justify-content: center;  /* centrado horizontal */
    padding: env(safe-area-inset-top, 0px) 4vw env(safe-area-inset-bottom, 0px);
    overflow: hidden;
  }

  h1 {
    margin: 0;
    width: 100%;
    text-align: center;
    font-family: "Cinzel", Georgia, "Times New Roman", serif;
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.1;
    color: var(--ink);
    font-size: 8vw; /* valor de respaldo; el script lo ajusta al ancho exacto */
  }

  main { position: relative; }

  /* Pie de página: centrado, abajo del todo */
  footer {
    position: absolute;
    left: 0;
    right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    text-align: center;
    padding: 0 4vw;
  }

  footer a,
  footer a:visited,
  footer a:hover,
  footer a:active {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.15rem, 1rem + 0.6vw, 1.5rem);
    color: var(--ink);              /* negro (claro en modo oscuro para que se vea) */
    text-decoration: underline;
    text-underline-offset: 0.2em;
    text-decoration-thickness: 1px;
  }

  h1 span { display: inline-block; white-space: nowrap; }

  /* Escritorio: en una sola línea */
  h1 span + span { margin-left: 0.3em; }

  /* Móvil: una palabra debajo de la otra */
  @media (max-width: 700px) {
    h1 { font-size: 15vw; }
    h1 span { display: block; }
    h1 span + span { margin-left: 0; }
  }
</style>
</head>
<body>
  <main>
    <h1 id="nombre"><span>Jaime</span> <span>Pascual</span></h1>
    <footer><a href="mailto:jpasx@hotmail.com">Escríbeme</a></footer>
  </main>

  <script>
    // Ajusta el tamaño de letra para que el texto ocupe todo el ancho disponible.
    (function () {
      var h1 = document.getElementById('nombre');
      var spans = h1.querySelectorAll('span');

      function fit() {
        var available = document.documentElement.clientWidth * 0.80;
        var test = 100; // tamaño de prueba en px
        h1.style.fontSize = test + 'px';

        var widest = 0;
        if (getComputedStyle(spans[0]).display === 'block') {
          // móvil: la línea más ancha manda
          spans.forEach(function (s) { widest = Math.max(widest, s.getBoundingClientRect().width); });
        } else {
          // escritorio: ancho de las dos palabras juntas
          widest = spans[0].getBoundingClientRect().width +
                   spans[1].getBoundingClientRect().width + test * 0.3;
        }
        h1.style.fontSize = (test * available / widest) + 'px';
      }

      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      window.addEventListener('load', fit);
      if (document.fonts) {
        // Medir de nuevo en cuanto Cinzel esté realmente cargada
        document.fonts.load('500 100px Cinzel').then(fit, fit);
        document.fonts.addEventListener('loadingdone', fit);
        if (document.fonts.ready) document.fonts.ready.then(fit);
      }
      fit();
    })();
  </script>
</body>
</html>
